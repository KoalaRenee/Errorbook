</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <div id="root"></div>

  <!-- Firebase Scripts -->
  <script type="module">

    import { getAuth, signInWithCustomToken, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, deleteUser } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";
    
    window.firebaseModules = { initializeApp, getAuth, signInWithCustomToken, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, deleteUser, getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp, getDoc, setDoc };
    window.dispatchEvent(new Event('firebase-loaded'));

  <!-- Main React App Script -->
  <script type="text/babel">
    window.addEventListener('firebase-loaded', () => {
      const { initializeApp, getAuth, signInWithCustomToken, signInWithPopup, GoogleAuthProvider, createUserWithEmailAndPassword, signInWithEmailAndPassword, signOut, onAuthStateChanged, updateProfile, deleteUser, getFirestore, collection, onSnapshot, addDoc, deleteDoc, doc, serverTimestamp, getDoc, setDoc } = window.firebaseModules;
      
      const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : {
        apiKey: "你的Firebase_API_KEY",
        authDomain: "你的專案.firebaseapp.com",
        projectId: "你的專案ID",

      const auth = getAuth(app);
      const db = getFirestore(app);
      const appId = typeof __app_id !== 'undefined' ? __app_id : 'my-production-app';

      const DSE_CORE = ['中國語文', '英國語文', '數學', '公民與社會發展'];
      const DSE_CAT_A = ['物理', '化學', '生物', '資訊及通訊科技 (ICT)', '企業、會計與財務概論 (BAFS)', '經濟', '地理', '歷史', '中國歷史', '旅遊與款待', '視覺藝術', '體育', '中國文學', '英語文學', '健康管理與社會關懷', '倫理與宗教', '設計與應用科技', '科技與生活', '音樂'];
      const DSE_CAT_B = ['數學延伸部分單元一 (M1)', '數學延伸部分單元二 (M2)'];

      const DICT = {
        '中國語文': 'Chinese Language', '英國語文': 'English Language', '數學': 'Mathematics', '公民與社會發展': 'Citizenship and Social Dev.',

        '經濟': 'Economics', '地理': 'Geography', '歷史': 'History', '中國歷史': 'Chinese History', '旅遊與款待': 'Tourism & Hospitality',
        '視覺藝術': 'Visual Arts', '體育': 'Physical Education', '中國文學': 'Chinese Literature', '英語文學': 'Literature in English',
        '健康管理與社會關懷': 'Health Mgt & Social Care', '倫理與宗教': 'Ethics & Religious Studies', '設計與應用科技': 'Design & Applied Tech',
        '科技與生活': 'Tech & Living', '音樂': 'Music', '數學延伸部分單元一 (M1)': 'Math Extended Part (M1)', '數學延伸部分單元二 (M2)': 'Math Extended Part (M2)',
        '其他': 'Others', '全部': 'All Subjects', '無': 'None',
        '粗心大意': 'Careless Mistake', '概念不清': 'Misconception', '審題錯誤': 'Misread Question', '計算錯誤': 'Calculation Error',
        '公式用錯': 'Wrong Formula', '完全不會': 'Completely Clueless', '自訂': 'Custom'
      };

      function resizeImage(file) {
        return new Promise((resolve, reject) => {
          const reader = new FileReader();
          reader.readAsDataURL(file);
          reader.onload = (event) => {
            const img = new Image();
            img.src = event.target.result;
            img.onload = () => {
              const canvas = document.createElement('canvas');
              const MAX_WIDTH = 800; const MAX_HEIGHT = 800;
              let width = img.width; let height = img.height;
              if (width > height) { if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; } } 
              else { if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; } }
              canvas.width = width; canvas.height = height;
              const ctx = canvas.getContext('2d');
              ctx.drawImage(img, 0, 0, width, height);
              resolve(canvas.toDataURL('image/jpeg', 0.7));
            };
          };
          reader.onerror = (error) => reject(error);
        });
      }

      function App() {
        const [user, setUser] = React.useState(null);
        const [userProfile, setUserProfile] = React.useState(null);
        const [questions, setQuestions] = React.useState([]);
        const [loading, setLoading] = React.useState(true);
        const [localLang, setLocalLang] = React.useState('zh'); 
        const [selectedSubject, setSelectedSubject] = React.useState('全部');
        const [selectedFolder, setSelectedFolder] = React.useState('全部');
        const [selectedReason, setSelectedReason] = React.useState('全部');
        const [isAddingModalOpen, setIsAddingModalOpen] = React.useState(false);
        const [isLogoutModalOpen, setIsLogoutModalOpen] = React.useState(false);

        const t = (zh, en) => localLang === 'en' ? en : zh;
        const tr = (text) => localLang === 'en' ? (DICT[text] || text) : text;

        React.useEffect(() => {
          const unsubscribe = onAuthStateChanged(auth, async (currentUser) => {
            setUser(currentUser);
            if (currentUser) {
              try {
                const profileRef = doc(db, 'artifacts', appId, 'users', currentUser.uid, 'settings', 'profile');
                const profileSnap = await getDoc(profileRef);
                if (profileSnap.exists()) {
                  const data = profileSnap.data();
                  if (data.subjects && data.subjects.length > 0) setUserProfile({ ...data, isNew: false });
                  else setUserProfile({ ...data, isNew: true });
                  if (data.language) setLocalLang(data.language);
                } else setUserProfile({ isNew: true });
              } catch (err) { setUserProfile({ isNew: true }); }
            } else {
              setUserProfile(null); setQuestions([]);
            }
            setLoading(false);
          });
          return () => unsubscribe();
        }, []);

        React.useEffect(() => {
          if (!user || !userProfile || userProfile.isNew) return;
          const questionsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'error_questions');
          const unsubQ = onSnapshot(questionsRef, (snapshot) => {
            const fetched = snapshot.docs.map(doc => ({ id: doc.id, ...doc.data() })).sort((a, b) => (a.timestamp?.toMillis() || 0) - (b.timestamp?.toMillis() || 0));
            setQuestions(fetched);
          });
          return () => unsubQ();
        }, [user, userProfile]);

        const handleSaveSubjects = async (subjects) => {
          if (!user) return;
          const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'settings', 'profile');
          const newProfile = { ...userProfile, subjects, language: localLang, isNew: false, updatedAt: serverTimestamp() };
          await setDoc(profileRef, newProfile, { merge: true });
          setUserProfile(newProfile); setSelectedSubject('全部');
        };

        const handleAddQuestion = async (formData) => {
          if (!user) return;
          const questionsRef = collection(db, 'artifacts', appId, 'users', user.uid, 'error_questions');
          await addDoc(questionsRef, { ...formData, timestamp: serverTimestamp() });
          setIsAddingModalOpen(false);
        };

        const handleDeleteQuestion = async (id) => {
          if (!user) return;
          await deleteDoc(doc(db, 'artifacts', appId, 'users', user.uid, 'error_questions', id));
        };

        if (loading) return React.createElement('div', { className: "min-h-screen flex items-center justify-center font-bold" }, "Loading...");
        if (!user) return React.createElement(AuthScreen, { lang: localLang, setLang: setLocalLang, t: t });
        if (userProfile?.isNew) return React.createElement(SetupProfileScreen, { onComplete: handleSaveSubjects, t: t, tr: tr });

        const filteredQuestions = questions.filter(q => {
          const matchSubject = selectedSubject === '全部' || q.subject === selectedSubject;
          const matchFolder = selectedSubject === '全部' || selectedFolder === '全部' || q.folder === selectedFolder;
          const matchReason = selectedReason === '全部' || q.reason === selectedReason;
          return matchSubject && matchFolder && matchReason;
        });

        return React.createElement('div', { className: "min-h-screen bg-slate-100 flex flex-col md:flex-row font-sans relative" },
          React.createElement('aside', { className: "w-full md:w-64 bg-white border-r border-slate-200 flex flex-col shadow-sm z-20" },
            React.createElement('div', { className: "p-5 border-b border-slate-100 flex items-center space-x-3 shrink-0" },
              React.createElement('div', { className: "bg-blue-600 p-2 rounded-lg text-white" }, React.createElement(lucide.Book, { className: "w-6 h-6" })),
              React.createElement('h1', { className: "text-xl font-bold text-slate-800" }, t("溫習神器", "Revision Pro"))
            ),
            React.createElement('div', { className: "flex-1 overflow-y-auto p-4 space-y-1" },
              React.createElement('h2', { className: "text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3 px-2" }, t("科目篩選", "Subjects")),
              ['全部', ...(userProfile?.subjects || [])].map(s => React.createElement('button', { key: s, onClick: () => { setSelectedSubject(s); setSelectedFolder('全部'); setSelectedReason('全部'); }, className: `w-full text-left px-3 py-2.5 rounded-lg ${selectedSubject === s ? 'bg-blue-50 text-blue-700 font-bold' : 'text-slate-600'}` }, tr(s)))
            ),
            React.createElement('div', { className: "p-4 border-t border-slate-200 bg-slate-50 flex items-center justify-between" },
              React.createElement('span', { className: "font-bold text-sm truncate" }, user.displayName || 'Student'),
              React.createElement('button', { onClick: () => signOut(auth), className: "p-2 bg-white rounded-lg border text-slate-400 hover:text-red-500" }, React.createElement(lucide.LogOut, { className: "w-4 h-4" }))
            )
          ),
          React.createElement('main', { className: "flex-1 flex flex-col h-screen overflow-hidden bg-slate-50" },
            React.createElement('header', { className: "bg-white p-5 border-b border-slate-200 flex items-center justify-between" },
              React.createElement('h2', { className: "text-2xl font-bold text-slate-800" }, tr(selectedSubject)),
              React.createElement('button', { onClick: () => setIsAddingModalOpen(true), className: "bg-blue-600 text-white px-4 py-2.5 rounded-xl font-medium" }, t("新增", "Add"))
            ),
            React.createElement('div', { className: "flex-1 overflow-y-auto p-6" },
              filteredQuestions.length === 0 ? React.createElement('div', { className: "text-center text-slate-400 py-20" }, t("目前沒有題目", "No questions")) :
              React.createElement('div', { className: "grid grid-cols-1 xl:grid-cols-2 gap-6" },
                filteredQuestions.map(q => React.createElement('div', { key: q.id, className: "bg-white p-5 rounded-2xl shadow-sm border space-y-3" },
                  React.createElement('div', { className: "flex justify-between items-center" },
                    React.createElement('span', { className: "bg-blue-100 text-blue-700 text-xs px-2.5 py-1 rounded font-medium" }, tr(q.subject)),
                    React.createElement('button', { onClick: () => handleDeleteQuestion(q.id), className: "text-slate-400 hover:text-red-500" }, React.createElement(lucide.Trash2, { className: "w-4 h-4" }))
                  ),
                  q.questionText && React.createElement('p', { className: "text-slate-800 text-sm whitespace-pre-wrap" }, q.questionText),
                  q.answerText && React.createElement('div', { className: "bg-green-50 p-3 rounded-xl text-green-800 text-sm" }, React.createElement('strong', {}, "Answer: "), q.answerText)
                ))
              )
            )
          ),
          isAddingModalOpen && React.createElement(AddQuestionModal, { onClose: () => setIsAddingModalOpen(false), onSave: handleAddQuestion, availableSubjects: userProfile?.subjects || DSE_CORE, t, tr })
        );
      }

      function AddQuestionModal({ onClose, onSave, availableSubjects, t, tr }) {
        const [subject, setSubject] = React.useState(availableSubjects[0] || '中國語文');
        const [reason, setReason] = React.useState(DEFAULT_REASONS[0]);
        const [qText, setQText] = React.useState(''); const [qImg, setQImg] = React.useState(null);
        const [aText, setAText] = React.useState(''); const [aImg, setAImg] = React.useState(null);

        const handleSubmit = (e) => {
          e.preventDefault();
          onSave({ subject, reason, questionText: qText, questionImgUrl: qImg, answerText: aText, answerImgUrl: aImg });
        };

        return React.createElement('div', { className: "fixed inset-0 z-50 flex items-center justify-center p-4 bg-slate-900/60" },
          React.createElement('form', { onSubmit: handleSubmit, className: "bg-white rounded-3xl shadow-2xl w-full max-w-xl p-6 space-y-4 max-h-[90vh] overflow-y-auto" },
            React.createElement('div', { className: "flex justify-between items-center" }, React.createElement('h3', { className: "font-bold text-lg" }, t("新增錯題", "Add Question")), React.createElement('button', { type: "button", onClick: onClose }, React.createElement(lucide.X, { className: "w-5 h-5" }))),
            React.createElement('div', {}, React.createElement('label', { className: "text-xs font-bold" }, t("科目", "Subject")), React.createElement('select', { value: subject, onChange: e => setSubject(e.target.value), className: "w-full border rounded-xl p-2" }, availableSubjects.map(s => React.createElement('option', { key: s, value: s }, tr(s))))),
            React.createElement('div', {}, React.createElement('label', { className: "text-xs font-bold" }, t("題目內容", "Question")), React.createElement('textarea', { rows: "3", value: qText, onChange: e => setQText(e.target.value), className: "w-full border rounded-xl p-2" })),
            React.createElement('div', {}, React.createElement('label', { className: "text-xs font-bold" }, t("答案內容", "Answer")), React.createElement('textarea', { rows: "3", value: aText, onChange: e => setAText(e.target.value), className: "w-full border rounded-xl p-2" })),
            React.createElement('div', { className: "flex justify-end space-x-2" },
              React.createElement('button', { type: "button", onClick: onClose, className: "px-4 py-2" }, t("取消", "Cancel")),
              React.createElement('button', { type: "submit", className: "px-4 py-2 bg-blue-600 text-white rounded-xl" }, t("儲存", "Save"))
            )
          )
        );
      }

      function AuthScreen({ lang, setLang, t }) {
        const [isLogin, setIsLogin] = React.useState(true);
        const [email, setEmail] = React.useState('');
        const [password, setPassword] = React.useState('');
        const [name, setName] = React.useState('');
        const [error, setError] = React.useState('');

        const handleAuth = async (e) => {
          e.preventDefault();
          try {
            if (isLogin) await signInWithEmailAndPassword(auth, email, password);
            else {
              const res = await createUserWithEmailAndPassword(auth, email, password);
              await updateProfile(res.user, { displayName: name });
            }
          } catch(err) { setError(err.message); }
        };

        return React.createElement('div', { className: "min-h-screen bg-slate-50 flex items-center justify-center p-4" },
          React.createElement('form', { onSubmit: handleAuth, className: "bg-white rounded-3xl shadow-xl p-8 max-w-md w-full space-y-4" },
            React.createElement('h1', { className: "text-2xl font-bold text-center text-blue-600 mb-4" }, t("溫習神器", "Revision Pro")),
            error && React.createElement('div', { className: "bg-red-50 text-red-600 p-3 rounded-xl text-xs" }, error),
            !isLogin && React.createElement('input', { type: "text", required: true, placeholder: t("用戶名稱", "Name"), value: name, onChange: e => setName(e.target.value), className: "w-full border rounded-xl p-3" }),
            React.createElement('input', { type: "email", required: true, placeholder: t("電子郵件", "Email"), value: email, onChange: e => setEmail(e.target.value), className: "w-full border rounded-xl p-3" }),
            React.createElement('input', { type: "password", required: true, minLength: 6, placeholder: t("密碼", "Password"), value: password, onChange: e => setPassword(e.target.value), className: "w-full border rounded-xl p-3" }),
            React.createElement('button', { type: "submit", className: "w-full bg-blue-600 text-white p-3 rounded-xl font-bold" }, isLogin ? t('登入', 'Login') : t('註冊', 'Register')),
            React.createElement('button', { type: "button", onClick: () => setIsLogin(!isLogin), className: "w-full text-sm text-blue-600 text-center" }, isLogin ? t("沒有帳戶？立即註冊", "No account? Register") : t("已有帳戶？登入", "Have account? Login"))
          )
        );
      }

      function SetupProfileScreen({ onComplete, t, tr }) {
        const [selectedSubjects, setSelectedSubjects] = React.useState([...DSE_CORE]);
        return React.createElement('div', { className: "min-h-screen bg-slate-50 flex items-center justify-center p-6" },
          React.createElement('div', { className: "bg-white max-w-2xl w-full rounded-3xl shadow-xl p-8 space-y-6" },
            React.createElement('h2', { className: "text-2xl font-bold" }, t("選擇你的 DSE 科目", "Select DSE Subjects")),
            React.createElement('div', { className: "grid grid-cols-2 gap-3 max-h-60 overflow-y-auto" },
              [...DSE_CORE, ...DSE_CAT_A, ...DSE_CAT_B].map(s => React.createElement('button', { type: "button", key: s, onClick: () => {
                if (selectedSubjects.includes(s)) setSelectedSubjects(selectedSubjects.filter(x => x !== s));
                else setSelectedSubjects([...selectedSubjects, s]);
              }, className: `p-3 border rounded-xl text-sm font-bold ${selectedSubjects.includes(s) ? 'bg-blue-50 border-blue-500 text-blue-700' : 'bg-white'}` }, tr(s)))
            ),
            React.createElement('button', { onClick: () => onComplete(selectedSubjects), className: "w-full bg-blue-600 text-white py-3 rounded-xl font-bold" }, t("開始使用", "Start Using"))
          )
        );
      }

      ReactDOM.render(React.createElement(App), document.getElementById('root'));
    });
  </script>
</body>
